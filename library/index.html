<!DOCTYPE html>

<html class="scroll-smooth" lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<meta content="#eaddd7" name="theme-color"/>
<link href="../manifest.json" rel="manifest"/>
<title>The Library — Vu Trong Duc Anh</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&amp;family=Outfit:wght@300;400;500;600;800;900&amp;family=JetBrains+Mono:wght@400;700&amp;display=swap" rel="stylesheet"/>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet"/>
<link href="../shared/shared.css" rel="stylesheet"/>
<script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        warm: {
                            50: '#fffbf7', 100: '#fdf5eb', 200: '#fbe8d4', 300: '#f5d3b3',
                            400: '#ebad7a', 500: '#e38847', 600: '#d56a31', 700: '#b15129',
                            800: '#8f4228', 900: '#4a2517',
                        }
                    },
                    fontFamily: {
                        mono: ['"JetBrains Mono"', 'monospace'],
                        outfit: ['"Outfit"', 'sans-serif'],
                        handwriting: ['"Caveat"', 'cursive']
                    },
                    fontWeight: { heavy: '900' }
                }
            }
        }
    </script>
<style>
        body {
            font-family: 'Outfit', sans-serif;
        }
        .book-card { transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1); }
        .book-card:hover { transform: translateY(-5px); }
        .book-cover {
            border-radius: 2px 8px 8px 2px;
            border-left: 4px solid rgba(255,255,255,0.25);
            box-shadow:
                inset 4px 0 10px rgba(0,0,0,0.1),
                inset -1px 0 2px rgba(255,255,255,0.3),
                5px 10px 20px -5px rgba(74,37,23,0.3),
                -2px 0 5px rgba(74,37,23,0.1);
            position: relative;
            overflow: hidden;
        }
        .book-cover::after {
            content: '';
            position: absolute; top: 2%; bottom: 2%; right: 0;
            width: 3px;
            background: linear-gradient(to right, #fdf5eb, #eaddd7);
            border-radius: 0 2px 2px 0;
            opacity: 0.8;
        }
        .book-cover-image { width: 100%; height: 100%; object-fit: cover; border-radius: 0 6px 6px 0; }
        .progress-bar-container { background-color: #fbe8d4; border-radius: 999px; height: 6px; overflow: hidden; box-shadow: inset 0 1px 2px rgba(0,0,0,0.05); }
        .progress-bar-fill { background-color: #d56a31; height: 100%; border-radius: 999px; transition: width 0.5s ease; }
        .spin-slow { animation: spin 2s linear infinite; }
        @keyframes spin { 100% { transform: rotate(360deg); } }
        #drag-overlay { transition: opacity 0.2s; }
    </style>
<link href="../shared/assets/favicon.png" rel="icon" type="image/png"/>
<style>#library-root { display:flex; justify-content:center; align-items:flex-start; }</style></head>

</html>
