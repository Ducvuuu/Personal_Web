<!DOCTYPE html>

<html class="scroll-smooth" lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<meta content="#fdfcf6" id="theme-color-meta" name="theme-color"/>
<link href="../manifest.json" rel="manifest"/>
<title>Reading — The Library</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&amp;family=Outfit:wght@300;400;500;600;800;900&amp;family=JetBrains+Mono:wght@400;700&amp;display=swap" rel="stylesheet"/>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet"/>
<script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        warm: {
                            50: '#fffbf7', 100: '#fdf5eb', 200: '#fbe8d4', 300: '#f5d3b3',
                            400: '#ebad7a', 500: '#e38847', 600: '#d56a31', 700: '#b15129',
                            800: '#8f4228', 900: '#4a2517',
                        }
                    },
                    fontFamily: {
                        mono: ['"JetBrains Mono"', 'monospace'],
                        outfit: ['"Outfit"', 'sans-serif'],
                        book: ['"Lora"', 'serif'],
                    }
                }
            }
        }
    </script>
<style>
        /* ── THEMES ── */
        body { background-color: #fdfcf6; color: #332925; transition: background-color 0.3s, color 0.3s; }
        body.theme-light { background-color: #ffffff; color: #1a1a1a; }
        body.theme-dark  { background-color: #1a1612; color: #d4c5b0; }

        /* ── READER UI FADE (distraction-free) ── */
        .reader-ui { transition: opacity 0.5s ease; }
        body.reading-mode .reader-ui { opacity: 0; pointer-events: none; }
        body.reading-mode .nav-arrow  { opacity: 0; pointer-events: none; }

        /* ── EPUB VIEWER ── */
        #viewer { width: 100%; height: 100%; }

        /* ── SCROLLBAR ── */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(143,66,40,0.15); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(143,66,40,0.35); }

        /* ── TOC PANEL ── */
        #toc-panel {
            transform: translateX(-100%);
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        #toc-panel.open { transform: translateX(0); }

        /* ── PAGE NAV ARROWS ── */
        .nav-arrow {
            position: fixed; top: 50%; transform: translateY(-50%);
            z-index: 25; width: 44px; height: 44px;
            background: rgba(253,252,246,0.9);
            border: 1px solid #f5d3b3; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; color: #8f4228;
            box-shadow: 0 2px 8px rgba(74,37,23,0.1);
            transition: all 0.2s;
        }
        .nav-arrow:hover { background: #fdf5eb; color: #d56a31; }
        .nav-arrow.left  { left: 12px; }
        .nav-arrow.right { right: 12px; }
        body.theme-dark .nav-arrow {
            background: rgba(26,22,18,0.9); border-color: #4a2517; color: #d4c5b0;
        }

        /* ── LOADING ── */
        .spin-slow { animation: spin 2s linear infinite; }
        @keyframes spin { 100% { transform: rotate(360deg); } }

        /* ── THEME-AWARE TOP/BOTTOM BARS ── */
        .bar-bg       { background: rgba(253,252,246,0.95); border-color: rgba(245,211,179,0.5); }
        .theme-light .bar-bg { background: rgba(255,255,255,0.95); }
        .theme-dark  .bar-bg { background: rgba(26,22,18,0.95); border-color: rgba(74,37,23,0.4); }

        /* ── RSVP ── */
        #rsvp-btn.rsvp-active { color: #d56a31; }
        .rsvp-mode-active { background: #d56a31 !important; color: white !important; border-color: #d56a31 !important; }
        .rsvp-mode-active span { color: white !important; }
        @keyframes rsvp-pulse { 0%,100%{opacity:1} 50%{opacity:.55} }
        .rsvp-bar-pulse { animation: rsvp-pulse 1.4s ease-in-out infinite; }

        /* ── RSVP PANEL LAYOUT — Floating on Desktop ── */
        #rsvp-panel {
            transition: transform 0.25s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.2s;
            transform: translateX(-100%);
        }
        body.rsvp-on #rsvp-panel { transform: translateX(0); }
        @media (min-width: 768px) {
            /* Panel floats freely — no epub shift, opacity-only animation */
            #rsvp-panel { transform: none !important; opacity: 0; pointer-events: none; }
            body.rsvp-on #rsvp-panel { opacity: 1; pointer-events: auto; }
        }
        body.theme-dark #rsvp-panel { background: #1e1a16 !important; border-color: rgba(74,37,23,0.5) !important; }
        body.theme-dark #rsvp-panel .bg-white { background: #1a1612 !important; }

        /* ── RSVP MINI-PAGE (mobile cutout window) ── */
        /* On mobile the panel root has no bg so the epub iframe shows through #rsvp-mini-page. */
        /* On desktop md:bg-[#fdfaf6] on the panel root covers everything (mini-page is hidden). */
        #rsvp-mini-page { position: relative; overflow: hidden; }
        /* Dark theme: panel root is transparent on mobile (cutout must stay clear),
           so apply dark bg only to the opaque child sections instead. */
        @media (max-width: 767px) {
            body.theme-dark #rsvp-panel    { background: transparent !important; }
            body.theme-dark #rsvp-display-area { background: #1e1a16 !important; }
        }
    </style>
<link href="../shared/assets/favicon.png" rel="icon" type="image/png"/>
</head>
<body class="min-h-screen font-book selection:bg-orange-200 selection:text-warm-900"><div id="reader-root"></div><script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-storage-compat.js"></script><script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script><script src="https://cdn.jsdelivr.net/npm/epubjs@0.3.93/dist/epub.min.js"></script><script src="./src/reader-main.jsx" type="module"></script></body>
</html>
